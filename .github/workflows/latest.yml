name: Latest
on: workflow_dispatch
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python recent.py
      - name: Save the report
        if: always()
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add recent_report.txt
          git commit -m "Scan report" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01T9BYzL3EByy15rMGr2VYvU" || true
          git pull --rebase origin main || true
          git push || true
      - name: Show the report
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat recent_report.txt >> "$GITHUB_STEP_SUMMARY" || echo "No report was produced" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
